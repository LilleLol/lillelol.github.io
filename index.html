<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#203040">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jet Lag Trondheim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-frame" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 15h.01M15 9h.01M9 15h.01"/></symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M12 1.5c.9 0 1.4 1 1.4 2.2v5.2l8.1 4.7v2.2l-8.1-2.5v4.6l2.4 1.8v1.8L12 20.6l-3.8.9v-1.8l2.4-1.8v-4.6l-8.1 2.5v-2.2l8.1-4.7V3.7c0-1.2.5-2.2 1.4-2.2z"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 8h-17C3.500 16 6 15 6 9zM10 20a2 2 0 0 0 4 0"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo"><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plane"/></svg>JET LAG</span>
      <div class="brand-text"><b><i class="coin"></i><span id="coinLabel">–</span></b><span><em id="teamLabel">–</em> · <em id="roomLabel">–</em></span></div>
    </div>
    <button class="top-btn" id="btnList" aria-label="Challenges" title="Challenges"><svg class="icon"><use href="#i-list"/></svg></button>
    <button class="top-btn" id="btnLog" aria-label="Logg" title="Logg"><svg class="icon"><use href="#i-log"/></svg></button>
    <button class="top-btn" id="btnShare" aria-label="Inviter" title="Inviter"><svg class="icon"><use href="#i-share"/></svg></button>
    <button class="top-btn" id="btnMenu" aria-label="Meny" title="Meny"><svg class="icon"><use href="#i-menu"/></svg></button>
  </header>
  <div class="conn hidden" id="conn"></div>
  <div class="mapwrap">
    <div id="map"></div>
    <button class="active-bar hidden" id="activeBar"><span class="flag">Aktiv</span><span id="activeBarName"></span></button>
    <button class="active-bar hidden" id="endBar"><span class="flag">Ferdig</span><span id="endBarText"></span><span class="flag dark">Se reprise</span></button>
    <div class="score" id="score"></div>
    <div class="fab-col">
      <button class="fab" id="btnFit" aria-label="Vis hele brettet" title="Vis hele brettet"><svg class="icon"><use href="#i-frame"/></svg></button>
      <button class="fab" id="btnLocate" aria-label="Min posisjon" title="Min posisjon"><svg class="icon"><use href="#i-locate"/></svg></button>
    </div>
  </div>
</div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="sheet-head"><span class="grip"></span><h2 id="sheetTitle"></h2>
    <button class="close-btn" id="sheetClose" aria-label="Lukk"><svg class="icon"><use href="#i-close"/></svg></button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="setup hidden" id="setup">
  <div class="setup-inner">
    <div class="title">
      <svg class="plane-big" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plane"/></svg>
      <span class="jl">JET LAG</span>
      <span class="bars"></span>
      <span class="city">Trondheim</span>
      <span class="tag">Taiwan-regler · Blå mot Rød</span>
    </div>
    <form id="setupForm" autocomplete="off">
      <div class="srv" id="srvStatus">Kobler til …</div>
      <label for="nameInput">Navnet ditt</label>
      <input class="field" id="nameInput" maxlength="20" placeholder="f.eks. Kasper" required>
      <label>Laget ditt</label>
      <div class="row2">
        <button type="button" class="btn pick-B" data-pick="B">Blå</button>
        <button type="button" class="btn pick-R" data-pick="R">Rød</button>
      </div>
      <div class="tabs">
        <button type="button" class="tab is-on" data-tab="join">Bli med</button>
        <button type="button" class="tab" data-tab="create">Nytt rom</button>
      </div>
      <div id="tabJoin" class="tabpane">
        <label for="codeInput">Romkode</label>
        <input class="field code-field" id="codeInput" maxlength="5" placeholder="ABCDE" autocapitalize="characters" spellcheck="false">
        <button type="submit" class="btn yellow" data-go="join">Bli med</button>
      </div>
      <div id="tabCreate" class="tabpane hidden">
        <label for="coinsInput">Coins hvert lag starter med</label>
        <input class="field" id="coinsInput" type="number" inputmode="numeric" min="0" max="9999" value="50">
        <label for="seedInput">Seed (valgfritt)</label>
        <input class="field" id="seedInput" maxlength="60" placeholder="tilfeldig hvis tom">
        <div class="hint">Samme seed gir samme challenges i samme rekkefølge på samme steder.</div>
        <button type="submit" class="btn yellow" data-go="create">Opprett rom</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastAction" class="hidden"></button></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="replay.js"></script>
<script src="app.js"></script>
</body>
</html>
